[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-ds"
version = "0.1.0"
description = "Zero-dependency probabilistic data structures in pure Python: Bloom filters, Count-Min Sketch, HyperLogLog and MinHash."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["bloom-filter", "hyperloglog", "count-min-sketch", "minhash", "probabilistic", "data-structures", "algorithms"]
authors = [{ name = "WsNodeX" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
cli = []

[project.scripts]
lattice = "lattice.cli:main"

[tool.setuptools.packages.find]
include = ["lattice*"]
